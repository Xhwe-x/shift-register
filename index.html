<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090e20" />
    <title>Shift Register（交接班）</title>
  </head>
  <body>
    <main id="shift-register" class="game-shell">
      <h1 class="sr-only">Shift Register / 交接班</h1>
      <section id="screen" hidden></section>
      <div id="play" role="region" tabindex="-1">
      <div>
        <div id="game" aria-hidden="true"></div>
        <p id="turn-message" aria-hidden="true"></p>
      </div>
      <p id="turn-status" class="sr-only" role="status"></p>
      <div id="controls" role="group" aria-label="Shift controls">
        <div class="primary-controls">
          <button type="button" data-command="SHIFT_LEFT" aria-keyshortcuts="ArrowLeft A">
            <span aria-hidden="true">←</span> <span class="control-label">Left</span> <kbd>Left Shift / A</kbd>
          </button>
          <button type="button" data-command="WAIT" aria-keyshortcuts="Space ArrowDown S">
            <span aria-hidden="true">•</span> <span class="control-label">Wait</span> <kbd>Space / S</kbd>
          </button>
          <button type="button" data-command="SHIFT_RIGHT" aria-keyshortcuts="ArrowRight D">
            <span aria-hidden="true">→</span> <span class="control-label">Right</span> <kbd>Right Shift / D</kbd>
          </button>
        </div>
        <div class="secondary-controls">
          <button type="button" data-command="UNDO" aria-keyshortcuts="Z Backspace" disabled><span class="control-label">Undo</span> <kbd>Z</kbd></button>
          <button type="button" data-command="RESTART" aria-keyshortcuts="R"><span class="control-label">Restart</span> <kbd>R</kbd></button>
          <button type="button" data-command="HINT" aria-keyshortcuts="H"><span class="control-label">Hint</span> <kbd>H</kbd></button>
          <button type="button" id="toggle-audio" aria-pressed="false">Mute</button>
          <button type="button" id="choose-shift">Shifts</button>
          <button type="button" id="view-report" class="accent-button" hidden>View timecard</button>
        </div>
      </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
